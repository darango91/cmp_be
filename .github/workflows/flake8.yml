name: Flake8

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: uv sync
    - name: Analysing the code with Flake8
      run: uv run flake8 .
